<style>
:root{--sun:#ffd21f;--hot:#ff2e63;--ink:#0d0713;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--ink);color-scheme:dark;font-family:'Russo One',Impact,'Arial Black',sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#wrap{position:relative;height:100%;max-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));aspect-ratio:9/16;max-width:100%;margin:0 auto}
canvas{width:100%;height:100%;display:block;background:#2f7d32}
#ui{position:absolute;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;text-align:center;padding:8%;background:rgba(13,7,19,.84);color:#fff}
#ui.hide{display:none}
h1{margin:0;font-weight:400;font-size:clamp(38px,13vw,62px);line-height:1;color:var(--sun);text-shadow:4px 4px 0 var(--hot)}

#score{font-size:44px;color:var(--sun)}
button{font:inherit;font-size:20px;padding:14px 32px;border:0;border-radius:10px;background:var(--hot);color:#fff;cursor:pointer;min-height:48px}
button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
[hidden]{display:none!important}
.sm{font-size:16px;padding:10px 20px;background:#3b1a5a;border:2px solid var(--sun)}
#sub{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#pz{position:absolute;top:10px;left:50%;margin-left:-22px;width:44px;height:44px;padding:0;font-size:15px;border-radius:50%;background:rgba(13,7,19,.7);border:2px solid #fff}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;text-align:center;padding:8%;background:rgba(13,7,19,.92);color:#fff}
.ov p{margin:0;font-family:system-ui,sans-serif;font-size:15px;color:#d8cde6}
#cars{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:280px}
.cb{height:72px;padding:0;font-size:16px;color:#1b1024;border:3px solid transparent}
.cb.sel{border-color:#fff;box-shadow:0 0 0 3px #111}
.cb{height:50px;font-size:14px}
#ctl{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:space-between;padding:0 10px;pointer-events:none}
#ctl div{display:flex;gap:10px}
.cbtn{pointer-events:auto;width:66px;height:66px;padding:0;border-radius:50%;font-size:26px;background:rgba(13,7,19,.55);border:2px solid rgba(255,255,255,.7);touch-action:none}
</style>
</head>
<body>
<div id="wrap">
 <canvas id="c" width="720" height="1280" aria-label="Игра Эль Дрифто"></canvas>
 <div id="ui">
  <h1 id="h">ЭЛЬ ДРИФТО</h1>
  <div id="score" hidden></div>
  <p id="msg">Дрифти по трассе, собирай золотые шины и не врезайся. Чем дольше занос, тем больше очков.</p>
  <p id="how">Касайся левой или правой половины экрана. На клавиатуре: ← и →.</p>
  <button id="go">Играть</button>
  <div id="sub"><button class="sm" id="gar">Гараж</button><button class="sm" id="snd">Звук: вкл</button></div>
  <button class="sm" id="menu" hidden>В меню</button>
 </div>
 <button id="pz" hidden aria-label="Пауза">II</button>
 <div id="ctl" hidden><div><button class="cbtn" id="bl" aria-label="Влево">◀</button><button class="cbtn" id="br" aria-label="Вправо">▶</button></div><div><button class="cbtn" id="bj" aria-label="Прыжок">▲</button><button class="cbtn" id="bf" aria-label="Огонь">🔫</button></div></div>
 <div class="ov" id="pause" hidden><h1>ПАУЗА</h1><button id="resume">Продолжить</button><button class="sm" id="tomenu">В меню</button></div>
 <div class="ov" id="garage" hidden><h1>ГАРАЖ</h1><p>Выбери транспорт и цвет.</p><div id="cars"></div><button id="back">Назад</button></div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');ctx.scale(2,2);
const W=360,H=640,L=70,R=290,CY=500,$=id=>document.getElementById(id);
const F='700 20px "Russo One",Impact,"Arial Black",sans-serif';
let ac,eng,engG,mode='menu',best=0,col='#ff2e63',soundOn=true,vi=0;
const VEH=[['Спорткар','car',15,900,3],['Мотоцикл','bike',9,1300,2],['Монстр-трак','truck',22,700,4],['Ховеркар','hover',16,1100,3]];
const SZ={cone:[9,9],scoot:[9,22],rival:[16,34],coin:[12,12],oil:[22,13],nitro:[12,12],heart:[12,12],shield:[12,12],jump:[12,12],wings:[14,12],gun:[12,12],ramp:[40,16],mine:[12,12]};
const SPN=[['cone',.2],['scoot',.12],['rival',.14],['coin',.14],['oil',.07],['nitro',.06],['heart',.05],['shield',.05],['jump',.05],['wings',.04],['gun',.04],['ramp',.04]];
const PICK=['coin','nitro','heart','shield','jump','wings','gun','sold','surv','tank'];
const TK=[['M1 ABRAMS','#b59b5a',.55,4],['T-90','#4f6b3a',.6,4],['M2 BRADLEY','#6e7f4a',.28,2],['T-90M','#3f5a35',.5,5]];
try{best=+localStorage.getItem('eldrifto-best')||0;col=localStorage.getItem('eldrifto-car')||col;soundOn=localStorage.getItem('eldrifto-snd')!=='0';vi=+localStorage.getItem('eldrifto-veh')||0}catch(e){}
let S,steer=0,keys={l:0,r:0},ptr={};
function snd(f,d=.15,type='square',v=.15,t0=0){if(!ac||!soundOn)return;const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,ac.currentTime+t0);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+t0+d);o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+t0);o.stop(ac.currentTime+t0+d)}
function startEngine(){if(!ac||!soundOn)return;eng=ac.createOscillator();engG=ac.createGain();eng.type='sawtooth';eng.frequency.value=70;engG.gain.value=.03;eng.connect(engG);engG.connect(ac.destination);eng.start()}
function stopEngine(){try{eng&&eng.stop()}catch(e){}eng=null;engG=null}
function reset(){S={sol:0,sv:0,crew:0,hum:0,tank:0,tt:0,ta:0,ccd:0,nsv:20,nmil:30,nz:1.5,zs:[],slip:0,nitro:0,bi:0,air:0,wings:0,shield:0,jumps:0,gun:1,fcd:0,boss:null,nb:60,bn:0,bul:[],shots:[],x:180,vx:0,ang:0,lives:VEH[vi][4],score:0,coins:0,combo:1,driftT:0,calm:0,speed:260,t:0,sc:0,inv:0,shake:0,spawn:.6,obs:[],par:[],marks:[],txt:[]}}
function say(t,x,y,col='#ffd21f'){S.txt.push({t,x,y,life:1.1,col})}
function spawn(){const r=Math.random(),x=L+24+Math.random()*(R-L-48);let o;
 let a=0,k='cone';for(const[kk,p]of SPN){a+=p;if(r<a){k=kk;break}}o={k,hw:SZ[k][0],hh:SZ[k][1],s:Math.random()*9,c:['#3aa0ff','#7ad65a','#ffd21f','#e9e9f4'][Math.random()*4|0]};
 o.x=x;o.y=-50;S.obs.push(o)}
function hit(o){
 if(o.k==='sold'||o.k==='surv'){if(o.k==='sold')S.sol++;else S.sv++;S.crew=S.sol+S.sv;say(o.k==='sold'?'+ВОЕННЫЙ':'+ВЫЖИВШИЙ',S.x,CY-50,'#7ad65a');snd(600,.12);snd(800,.12,'square',.15,.1);if(S.sol>=5&&!S.hum){S.hum=1;S.lives=Math.min(8,S.lives+3);S.shake=.4;say('HUMMER H1!',180,220,'#ffd21f');snd(200,.5,'sawtooth',.3);boom(S.x,CY,30)}return true}
 if(o.k==='tank'){S.tank=15;S.tt=o.tt;say(TK[o.tt][0]+'!',180,220,'#ffd21f');snd(120,.6,'sawtooth',.3);boom(S.x,CY,25);return true}
 if(o.k==='heart'){S.lives=Math.min(6,S.lives+1);say('+♥',S.x,CY-50,'#ff2e63');snd(700,.15);snd(1000,.2,'square',.15,.1);return true}
 if(o.k==='shield'){S.shield=6;say('ЩИТ!',S.x,CY-50,'#6fe');snd(500,.3,'sine',.2);return true}
 if(o.k==='jump'){S.jumps=Math.min(3,S.jumps+1);say('ПРЫЖОК +1',S.x,CY-50,'#7ad65a');snd(600,.15);return true}
 if(o.k==='wings'){S.air=3;S.wings=3;say('КРЫЛЬЯ!',S.x,CY-50,'#fff');snd(500,.5,'triangle',.25);return true}
 if(o.k==='gun'){S.gun=Math.min(3,S.gun+1);say('ОРУЖИЕ '+S.gun,S.x,CY-50,'#ffb21f');snd(250,.2,'sawtooth',.2);return true}
 if(o.k==='ramp'){S.air=Math.max(S.air,1.1);say('ТРАМПЛИН!',S.x,CY-50,'#fff');snd(400,.3,'triangle',.25);return true}
 if(o.k==='oil'){S.slip=1.1;say('ЗАНОС!',o.x,CY-50,'#b388ff');snd(300,.3,'sawtooth',.12);return true}
 if(o.k==='nitro'){S.nitro=4;S.inv=Math.max(S.inv,4);say('НИТРО!',S.x,CY-60,'#35b8ff');snd(300,.5,'sawtooth',.2);snd(900,.3,'square',.15,.15);return true}
 if(o.k==='coin'){S.coins++;S.score+=100*S.combo;say('+'+100*S.combo,o.x,o.y);snd(880,.1);snd(1320,.18,'square',.15,.08);for(let i=0;i<8;i++)S.par.push({x:o.x,y:o.y,vx:(Math.random()-.5)*160,vy:(Math.random()-.5)*160,l:.5,g:1});return true}
 if(S.inv>0)return false;if(S.tank>0||(S.hum&&o.k==='zombie')){S.score+=50;boom(S.x,CY-30,6);snd(150,.1,'square',.1);return true}if(S.crew>0){S.crew--;if(S.sv>0)S.sv--;else S.sol=Math.max(0,S.sol-1);S.inv=1.2;S.shake=.25;say('-1 боец',S.x,CY-50,'#ff2e63');snd(160,.2,'sawtooth',.2);return true}S.lives--;S.inv=1.6;S.shake=.4;S.driftT=0;S.combo=1;say('ЭЭЭ!',S.x,CY-50,'#ff2e63');snd(110,.4,'sawtooth',.3);snd(70,.5,'square',.2,.1);
 if(S.lives<=0)over();return true}
function update(dt){S.t+=dt;S.speed=(260+Math.min(S.t*6,300))*(S.nitro>0?1.45:1);S.nitro=Math.max(0,S.nitro-dt);S.slip=Math.max(0,S.slip-dt);
 const s=Math.max(-1,Math.min(1,steer+keys.r-keys.l));
 S.vx+=s*VEH[vi][3]*dt+(S.slip>0?(Math.random()-.5)*2200*dt:0);S.vx-=S.vx*(s?1.1:3.2)*dt;S.vx=Math.max(-280,Math.min(280,S.vx));S.x+=S.vx*dt;
 if(S.x<L+18){S.x=L+18;S.vx=Math.abs(S.vx)*.4}if(S.x>R-18){S.x=R-18;S.vx=-Math.abs(S.vx)*.4}
 const target=S.vx/280*(Math.abs(S.vx)>110?1.2:.7);S.ang+=(target-S.ang)*Math.min(1,7*dt);
 const dr=Math.abs(S.vx)>110;
 if(dr){S.driftT+=dt;S.calm=0;for(let i=0;i<2;i++){S.par.push({x:S.x+(Math.random()-.5)*26,y:CY+34,vx:(Math.random()-.5)*50,vy:S.speed*.25+Math.random()*60,l:.7,g:0});}
  [-10,10].forEach(d=>S.marks.push({x:S.x+d,y:CY+28}))}else{S.calm+=dt;if(S.calm>.7)S.driftT=0}
 const pc=S.combo;S.combo=Math.min(9,1+Math.floor(S.driftT*1.2));
 if(S.combo>pc&&[3,5,9].includes(S.combo)){say(['ЛЕГЕНДА!','КОРОЛЬ!','ДРИФТООО!'][[3,5,9].indexOf(S.combo)],S.x,CY-70);snd(660,.12);snd(990,.2,'square',.15,.1)}
 S.score+=S.speed*dt/12*S.combo;S.sc+=S.speed*dt;
 const nb=Math.floor(S.sc/9000)%7;if(nb!==S.bi){S.bi=nb;say(['ЛЕС','ПУСТЫНЯ','ЗИМА','КИБЕРПАНК-ГОРОД','ШКОЛА','ВУЛКАН','ГОРЫ'][nb],180,200,'#fff')}
 if(S.nitro>0)S.par.push({x:S.x+(Math.random()-.5)*14,y:CY+38,vx:(Math.random()-.5)*40,vy:S.speed*.5,l:.35,g:1});
 S.spawn-=dt;if(S.spawn<=0){spawn();S.spawn=(.55+Math.random()*.6)*Math.max(.45,1-S.t/120)}
 S.inv=Math.max(0,S.inv-dt);S.shake=Math.max(0,S.shake-dt);
 for(const o of S.obs){o.y+=S.speed*(o.k==='rival'?.55:1)*dt;if(o.k==='scoot'){o.s+=dt;o.x+=Math.sin(o.s*4)*40*dt}
  if(!o.dead&&(S.air<=0||PICK.includes(o.k))&&Math.abs(o.x-S.x)<o.hw+vhw()&&Math.abs(o.y-CY)<o.hh+34&&hit(o))o.dead=true}
 S.obs=S.obs.filter(o=>!o.dead&&o.y<H+60);
 for(const p of S.par){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt}S.par=S.par.filter(p=>p.l>0);
 for(const m of S.marks)m.y+=S.speed*dt;S.marks=S.marks.filter(m=>m.y<H+10).slice(-240);
 for(const t of S.txt){t.y-=40*dt;t.life-=dt}S.txt=S.txt.filter(t=>t.life>0);
 step2(dt);step3(dt);if(engG&&eng){eng.frequency.value=60+S.speed*.22+Math.abs(S.vx)*.1}}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h);ctx.fill()}
function ell(x,y,a,b){ctx.beginPath();ctx.ellipse(x,y,a,b,0,0,7);ctx.fill()}
function car(x,y,a,body,hat,g){ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.scale(1.15,1.15);
 ctx.fillStyle='#111';rr(-17,-20,6,16,2);rr(11,-20,6,16,2);rr(-17,12,6,16,2);rr(11,12,6,16,2);
 ctx.fillStyle='rgba(0,0,0,.3)';rr(-9,-24,28,62,10);ctx.shadowColor=body;ctx.shadowBlur=g?22:0;ctx.fillStyle=body;rr(-13,-30,26,60,8);ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.fillRect(-2,-30,4,60);
 ctx.fillStyle='#9fd8ff';rr(-9,-14,18,10,3);ctx.fillStyle='#7ab8e0';rr(-8,6,16,8,3);ctx.fillStyle='#111';ctx.fillRect(-15,26,30,5);rr(-18,-14,4,6,1);rr(14,-14,4,6,1);ctx.fillStyle='#ff1a1a';ctx.fillRect(-12,22,6,3);ctx.fillRect(6,22,6,3);
 ctx.fillStyle='#fffbd0';ctx.fillRect(-11,-30,6,3);ctx.fillRect(5,-30,6,3);
 if(hat){ctx.fillStyle='#e0a526';ell(0,8,11,8);ctx.fillStyle='#c88a10';ell(0,8,4,3)}ctx.restore()}
function drawObs(o){const{x,y}=o;ctx.save();
 if(o.k==='cone'){ctx.fillStyle='#ff7a1f';ctx.beginPath();ctx.moveTo(x,y-10);ctx.lineTo(x+9,y+9);ctx.lineTo(x-9,y+9);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(x-5,y,10,3)}
 else if(o.k==='scoot'){ctx.fillStyle='#aaa';rr(x-3,y-20,6,40,2);ctx.fillStyle='#222';ctx.fillRect(x-10,y-16,20,3);ctx.fillStyle='#7ad65a';ell(x,y+2,11,7);ctx.fillStyle='#f2c9a0';ell(x,y+2,6,6);ctx.fillStyle='#c9a227';ctx.beginPath();ctx.arc(x,y+1,6,Math.PI,0);ctx.fill()}
 else if(o.k==='sold'||o.k==='surv'){ctx.fillStyle='rgba(0,0,0,.3)';ell(x+3,y+4,11,9);ctx.fillStyle=o.k==='sold'?'#4f6b3a':'#ff8a3d';ell(x,y,12,8);ctx.fillStyle=o.k==='sold'?'#5b7a3a':'#f2c9a0';ell(x,y,7,7);ctx.strokeStyle='rgba(255,255,255,'+(.4+.3*Math.sin(S.t*6))+')';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,17,0,7);ctx.stroke()}
 else if(o.k==='tank'){drawTank(x,y,o.tt,0);ctx.strokeStyle='rgba(255,210,31,'+(.5+.4*Math.sin(S.t*6))+')';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,40,0,7);ctx.stroke()}
 else if(o.k==='heart'){ctx.fillStyle='#ff2e63';ell(x-5,y-3,7,7);ell(x+5,y-3,7,7);ctx.beginPath();ctx.moveTo(x-12,y);ctx.lineTo(x,y+13);ctx.lineTo(x+12,y);ctx.fill()}
 else if(o.k==='shield'){ctx.fillStyle='#35d0c0';ctx.beginPath();ctx.moveTo(x-11,y-11);ctx.lineTo(x+11,y-11);ctx.lineTo(x+11,y+1);ctx.lineTo(x,y+13);ctx.lineTo(x-11,y+1);ctx.fill();ctx.fillStyle='#0b3a44';ell(x,y-1,4,4)}
 else if(o.k==='jump'){ctx.fillStyle='#7ad65a';ell(x,y,12,12);ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(x,y-8);ctx.lineTo(x+7,y+2);ctx.lineTo(x-7,y+2);ctx.fill();ctx.fillRect(x-2,y+2,4,6)}
 else if(o.k==='wings'){ctx.fillStyle='#fff';ell(x,y,13,10);ctx.fillStyle='#9fd8ff';ctx.beginPath();ctx.moveTo(x-3,y);ctx.lineTo(x-17,y-9);ctx.lineTo(x-12,y+4);ctx.fill();ctx.beginPath();ctx.moveTo(x+3,y);ctx.lineTo(x+17,y-9);ctx.lineTo(x+12,y+4);ctx.fill()}
 else if(o.k==='gun'){ctx.fillStyle='#ff8a3d';ell(x,y,12,12);ctx.fillStyle='#111';ctx.fillRect(x-8,y-3,16,5);ctx.fillRect(x-8,y,5,7)}
 else if(o.k==='ramp'){ctx.fillStyle='#ffd21f';ctx.beginPath();ctx.moveTo(x-40,y+16);ctx.lineTo(x+40,y+16);ctx.lineTo(x+30,y-16);ctx.lineTo(x-30,y-16);ctx.fill();ctx.fillStyle='#111';for(let i=-3;i<3;i++)ctx.fillRect(x+i*12+2,y-12,6,24)}
 else if(o.k==='mine'){ctx.fillStyle='#222';ell(x,y,12,12);ctx.fillStyle='#ff2e63';ell(x,y,4+Math.sin(S.t*12)*1.5,4);ctx.strokeStyle='#ff2e63';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,12,0,7);ctx.stroke()}
 else if(o.k==='rival')car(x,y,0,o.c||'#3aa0ff',false);
 else if(o.k==='oil'){ctx.fillStyle='#0b0b12';ell(x,y,22,13);ctx.fillStyle='rgba(120,90,255,.35)';ell(x-5,y-2,13,6);ctx.fillStyle='rgba(60,220,200,.3)';ell(x+7,y+2,9,4)}
 else if(o.k==='nitro'){ctx.fillStyle='#35b8ff';ctx.beginPath();ctx.moveTo(x,y-14);ctx.lineTo(x+11,y);ctx.lineTo(x,y+14);ctx.lineTo(x-11,y);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(x+2,y-8);ctx.lineTo(x-5,y+1);ctx.lineTo(x,y+1);ctx.lineTo(x-2,y+8);ctx.lineTo(x+5,y-1);ctx.lineTo(x,y-1);ctx.fill()}

function drawZ(z){const w=Math.sin(z.t*6)*3;ctx.save();ctx.translate(z.x,z.y);ctx.fillStyle='rgba(0,0,0,.28)';ell(3,4,11,9);ctx.fillStyle='#6b8a55';ell(-10,-8+w,4,7);ell(10,-8-w,4,7);ctx.fillStyle='#5a6f7a';ell(0,2,11,8);ctx.fillStyle='#8fb870';ell(0,-2,7,7);ctx.fillStyle='#ff1a1a';ell(-3,-5,1.6,1.6);ell(3,-5,1.6,1.6);ctx.restore()}
function drawTank(x,y,tt,a){const c=TK[tt][1];ctx.save();ctx.translate(x,y);ctx.fillStyle='rgba(0,0,0,.3)';rr(-20,-32,46,70,6);ctx.fillStyle='#222';rr(-24,-36,12,72,4);rr(12,-36,12,72,4);ctx.fillStyle='#444';for(let i=-30;i<34;i+=8){ctx.fillRect(-24,i,12,2);ctx.fillRect(12,i,12,2)}ctx.fillStyle=c;rr(-14,-34,28,68,5);if(tt===2){ctx.fillStyle='#55633a';rr(-14,-34,28,20,5)}if(tt===3){ctx.fillStyle='#2f4a2a';rr(-18,-20,6,24,2);rr(12,-20,6,24,2)}ctx.translate(0,2);ctx.rotate(a||0);ctx.fillStyle=c;if(tt===2)rr(-9,-10,18,20,4);else ell(0,0,13,12);ctx.fillStyle='#222';rr(-2.5,tt===2?-30:-44,5,tt===2?24:38,2);ctx.fillStyle='#111';ell(0,0,4,4);ctx.restore()}
function drawHum(x,y,a){ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.fillStyle='rgba(0,0,0,.3)';rr(-14,-28,36,66,6);ctx.fillStyle='#111';[[-22,-26],[14,-26],[-22,10],[14,10]].forEach(([px,py])=>rr(px,py,8,18,3));ctx.fillStyle='#5b6b3a';rr(-18,-34,36,70,6);ctx.fillStyle='#4a5830';rr(-18,-34,36,18,6);ctx.fillStyle='#9fd8ff';rr(-12,-14,24,8,2);ctx.fillStyle='#3d4a28';ctx.fillRect(-18,-6,36,3);ctx.fillRect(-18,18,36,3);ctx.fillStyle='#fffbd0';ctx.fillRect(-14,-34,7,3);ctx.fillRect(7,-34,7,3);ctx.fillStyle='#ff1a1a';ctx.fillRect(-15,33,8,3);ctx.fillRect(7,33,8,3);ctx.fillStyle='#222';ell(0,6,10,10);ctx.save();ctx.translate(0,6);ctx.rotate(S.ta||0);ctx.fillStyle='#333';rr(-2.5,-26,5,22,2);ctx.fillStyle='#4f6b3a';ell(0,0,7,7);ctx.fillStyle='#8aa05a';ell(0,0,5,5);ctx.restore();ctx.restore()}
function step3(dt){
 S.tank=Math.max(0,S.tank-dt);
 const t=tgt();S.ta+=((t?Math.atan2(t.x-S.x,-(t.y-CY)):0)-S.ta)*Math.min(1,10*dt);
 if(S.t>=S.nsv){S.nsv+=20;S.obs.push({k:Math.random()<.5?'sold':'surv',hw:13,hh:14,x:L+24+Math.random()*(R-L-48),y:-50,s:0});say('ВЫЖИВШИЕ!',180,200,'#7ad65a')}
 if(S.t>=S.nmil){S.nmil+=30;if(Math.random()<.2){S.obs.push({k:'tank',tt:Math.random()*4|0,hw:24,hh:34,x:L+30+Math.random()*(R-L-60),y:-60,s:0});say('ВОЕННАЯ ТЕХНИКА!',180,200,'#ffd21f')}}
 S.nz-=dt;if(S.nz<=0){S.nz=Math.max(.35,1.8-S.t/80)*(S.boss?.6:1);for(let i=0,n=1+(Math.random()*2|0);i<n;i++)zspawn(-30)}
 S.ccd-=dt;if(S.crew>0&&S.ccd<=0&&t){S.ccd=Math.max(.3,1-S.crew*.1);const side=t.x<S.x?-1:1,sx=S.x+side*14,sy=CY-6,d=Math.hypot(t.x-sx,t.y-sy)||1;S.bul.push({x:sx,y:sy,vx:(t.x-sx)/d*520,vy:(t.y-sy)/d*520});snd(700,.04,'square',.04)}
 for(const z of S.zs){z.t+=dt;z.y+=S.speed*.7*dt;if(z.y<CY)z.x+=Math.sign(S.x-z.x)*35*dt;z.x=Math.max(L+8,Math.min(R-8,z.x+Math.sin(z.t*3)*20*dt));if(!z.dead&&S.air<=0&&Math.abs(z.x-S.x)<vhw()+8&&Math.abs(z.y-CY)<32){z.dead=1;S.score+=10;boom(z.x,z.y,4);hit({k:'zombie'})}}
 for(const b of S.bul){if(b.dead)continue;for(const z of S.zs){if(!z.dead&&Math.abs(b.x-z.x)<14&&Math.abs(b.y-z.y)<16){z.hp-=(b.dmg||1);if(!b.big)b.dead=1;if(z.hp<=0){z.dead=1;S.score+=20;boom(z.x,z.y,5)}break}}}
 S.zs=S.zs.filter(z=>!z.dead&&z.y<H+40);S.bul=S.bul.filter(b=>!b.dead&&b.x>-20&&b.x<W+20&&b.y>-20&&b.y<H)}
reset();showMenu();requestAnimationFrame(loop);
</script>

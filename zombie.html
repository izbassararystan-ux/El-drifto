<script>

let ac,eng,engG,mode='menu',S,steer=0,keys={l:0,r:0,f:0},ptr={},gcat='car';
function snd(f,d=.15,type='square',v=.15,t0=0){if(!ac||!P.snd)return;const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,ac.currentTime+t0);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+t0+d);o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+t0);o.stop(ac.currentTime+t0+d)}

function tgt(){let best=null,bd=1e9;for(const z of S.zs.concat(S.boss?[S.boss]:[])){const d=Math.hypot(z.x-S.x,z.y-CY);if(z.y<CY+60&&z.y>-10&&d<bd&&d<420){bd=d;best=z}}return best}
function hit(o){const k=o.k;
 if(k==='sold'||k==='surv'){if(k==='sold')S.sol++;else S.sv++;S.crew=S.sol+S.sv;say(k==='sold'?'+ВОЕННЫЙ':'+ВЫЖИВШИЙ',S.x,CY-50,'#7ad65a');snd(600,.12);snd(800,.12,'square',.15,.1);if(S.sol>=5&&!S.hum&&S.v[2]==='car'){S.hum=1;S.lives=Math.min(9,S.lives+3);S.shake=.4;say('HUMMER H1!',180,220,'#ffd21f');snd(200,.5,'sawtooth',.3);boom(S.x,CY,30)}return true}
 if(k==='tank'){S.tank=15;S.tt=o.tt;say(TK[o.tt][0]+'!',180,220,'#ffd21f');snd(120,.6,'sawtooth',.3);boom(S.x,CY,25);return true}
 if(k==='heart'){S.lives=Math.min(9,S.lives+1);say('+♥',S.x,CY-50,'#ff2e63');snd(700,.15);snd(1000,.2,'square',.15,.1);return true}

 if(k==='wings'){S.air=3;S.wings=3;say('КРЫЛЬЯ!',S.x,CY-50,'#fff');snd(500,.5,'triangle',.25);return true}
 if(k==='gun'){S.gun=Math.min(3,S.gun+1);say('ОРУЖИЕ '+S.gun,S.x,CY-50,'#ffb21f');snd(250,.2,'sawtooth',.2);return true}
 if(k==='ramp'){S.air=Math.max(S.air,1.1);say('ТРАМПЛИН!',S.x,CY-50,'#fff');snd(400,.3,'triangle',.25);return true}
 if(k==='oil'){S.slip=1.1;say('ЗАНОС!',o.x,CY-50,'#b388ff');snd(300,.3,'sawtooth',.12);return true}

 S.lives--;S.inv=1.6;S.shake=.4;S.driftT=0;S.combo=1;say('ЭЭЭ!',S.x,CY-50,'#ff2e63');snd(110,.4,'sawtooth',.3);snd(70,.5,'square',.2,.1);
 if(S.lives<=0)lose();return true}
function fire(){const v=S.v,c=v[2],t=tgt();
 if(S.tank>0||c==='tank'){const tt=S.tank>0?S.tt:TTMAP[v[0]],T=TK[tt];S.fcd=T[2];let dx=0,dy=-1;if(t){const d=Math.hypot(t.x-S.x,t.y-CY)||1;dx=(t.x-S.x)/d;dy=(t.y-CY)/d}S.bul.push({x:S.x,y:CY-30,vx:dx*480,vy:dy*480,big:1,dmg:T[3]});snd(120,.2,'sawtooth',.2);S.shake=Math.max(S.shake,.06);return}

function update(dt){const v=S.v,c=v[2],fl=flies();S.t+=dt;
